# Tool configuration only. Runtime dependencies are pinned in requirements*.txt
# (Render installs with `pip install -r requirements.txt`).

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
